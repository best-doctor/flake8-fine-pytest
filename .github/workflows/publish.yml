name: Publish Python package

on:
  push:
    tags:
      - '*'
  # Lets a maintainer retrigger a release from the Actions tab without having
  # to move a tag, e.g. after fixing the PYPI_API_TOKEN secret.
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run checks
        run: |
          uv run flake8 .
          uv run mypy flake8_fine_pytest
          uv run pytest --cov --cov-report=term

  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.10'
      - name: Build distributions
        run: uv build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Classic API-token auth: no PyPI trusted-publisher registration needed.
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
